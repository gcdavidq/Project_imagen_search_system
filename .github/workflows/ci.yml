name: CI

on:
  push:
    branches: [main, modernizacion]
  pull_request:

jobs:
  backend:
    name: Backend · lint + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependencias (sin PyTorch, las pruebas usan dobles)
        run: |
          python -m pip install --upgrade pip
          pip install fastapi "uvicorn[standard]" python-multipart python-dotenv \
                      Pillow numpy psycopg2-binary pgvector requests tqdm \
                      pytest httpx ruff

      - name: Ruff (lint + orden de imports)
        run: ruff check .

      - name: Pytest
        run: pytest

  frontend:
    name: Frontend · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run build
