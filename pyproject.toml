[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["frontend", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008"]  # FastAPI usa llamadas en defaults (File(), Form()) por diseño

[tool.ruff.lint.isort]
known-first-party = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
